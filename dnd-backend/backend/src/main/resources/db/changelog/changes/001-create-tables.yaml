                  name: proficiencies
                  type: TEXT
              - column:
                  name: saving_throws
                  type: TEXT
              - column:
                  name: starting_equipment
                  type: TEXT
              - column:
                  name: class_levels
                  type: VARCHAR(255)
              - column:
                  name: multi_classing
                  type: TEXT
              - column:
                  name: subclasses
                  type: TEXT
              - column:
                  name: url
                  type: VARCHAR(255)

