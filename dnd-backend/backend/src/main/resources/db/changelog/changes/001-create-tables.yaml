databaseChangeLog:
  - changeSet:
      id: 001
      author: petro
      changes:

        # -------------------------
        # ability_score
        # -------------------------
        - createTable:
            tableName: ability_scores
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: original_index
                  type: VARCHAR(255)
              - column:
                  name: name
                  type: VARCHAR(255)
              - column:
                  name: full_name
                  type: VARCHAR(255)
              - column:
                  name: description
                  type: TEXT
              - column:
                  name: skills
                  type: TEXT
              - column:
                  name: url
                  type: VARCHAR(255)

        # -------------------------
